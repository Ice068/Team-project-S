<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Test-Pro (HTML Only)</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<table width="100%" cellpadding="10">
  <tr>
    <td><b>Test-Pro</b></td>
    <td align="right">
      <button onclick="runCode()">Run</button>
    </td>
  </tr>
</table>

<hr>

<!-- MAIN LAYOUT -->
<table width="100%" height="600" cellpadding="10" border="0">
  <tr valign="top">

    <!-- LEFT : CODE -->
    <td width="50%">

      <b>HTML</b><br>
      <textarea id="htmlCode" rows="8" style="width:100%;">
<h1>Teach Web</h1>
<p>HTML / CSS Test</p>
<button onclick="sayHi()">Click</button>
      </textarea>

      <br><br>

      <b>CSS</b><br>
      <textarea id="cssCode" rows="8" style="width:100%;">
body{
  font-family: Arial;
  text-align:center;
}
      </textarea>

      <br><br>

      <b>JavaScript</b><br>
      <textarea id="jsCode" rows="6" style="width:100%;">
function sayHi(){
  alert("สวัสดี! คุณกำลังเรียนเขียนเว็บอยู่ 😄");
}
      </textarea>

    </td>

    <!-- RIGHT : PREVIEW -->
    <td width="50%">
      <b>Preview (ผลลัพธ์)</b><br><br>
      <iframe id="output" width="100%" height="100%"></iframe>
    </td>

  </tr>
</table>

<script>
function runCode(){
  var html = document.getElementById("htmlCode").value;
  var css = document.getElementById("cssCode").value;
  var js = document.getElementById("jsCode").value;

  document.getElementById("output").srcdoc = `
<!DOCTYPE html>
<html>
<head>
<style>${css}</style>
</head>
<body>
${html}
<script>${js}<\/script>
</body>
</html>
`;
}

runCode();
</script>

</body>
</html>
