<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Teach Web</title>
<link rel="stylesheet" href="style_index.css">
<link rel="JavaScript" href="script.js">
</head>

<body>

<header>
  <h1>Teach Web</h1>
  <p>คลิกการ์ดเพื่อเริ่มเรียน</p>
</header>

<div class="cards">

  <!-- HTML CARD -->
  <div class="card" onclick="flipCard(this)">
    <div class="card-inner">
      <div class="card-front">
        <h2>HTML</h2>
        <p>โครงสร้างเว็บไซต์</p>
      </div>
      <div class="card-back">
        <h3>HTML</h3>
        <p>ใช้สร้างโครงร่างของเว็บ</p>
        <button onclick="goPage(event,'html.html')">เข้าเรียน</button>
      </div>
    </div>
  </div>

  <!-- CSS CARD -->
  <div class="card" onclick="flipCard(this)">
    <div class="card-inner">
      <div class="card-front">
        <h2>CSS</h2>
        <p>ตกแต่งเว็บไซต์</p>
      </div>
      <div class="card-back">
        <h3>CSS</h3>
        <p>ทำให้เว็บสวยงาม</p>
        <button onclick="goPage(event,'css.html')">เข้าเรียน</button>
      </div>
    </div>
  </div>

  <!-- JS CARD -->
  <div class="card" onclick="flipCard(this)">
    <div class="card-inner">
      <div class="card-front">
        <h2>JavaScript</h2>
        <p>ทำให้เว็บโต้ตอบได้</p>
      </div>
      <div class="card-back">
        <h3>JavaScript</h3>
        <p>เพิ่มลูกเล่นและ logic</p>
        <button onclick="goPage(event,'js.html')">เข้าเรียน</button>
      </div>
    </div>
  </div>

  <!-- test Code -->
    <div class="card" onclick="flipCard(this)">
        <div class="card-inner">
        <div class="card-front">
            <h2>ทดสอบโค้ด</h2>
            <p>ลองเขียนโค้ด HTML, CSS, JS</p>
        </div>
        <div class="card-back">
            <h3>ทดสอบโค้ด</h3>
            <p>ฝึกเขียนโค้ดเว็บแบบง่ายๆ</p>
            <button onclick="goPage(event,'testcode.html')">เข้าเรียน</button>
            </div>
        </div>

</div>

<script src="script.js"></script>
</body>
</html>
